# canon protected v1 — 층 ③(canon-guard) 보호 경로 목록  [예시]
# mindvirus-defense kit · MIT
#
# 줄당 경로 1개. 끝에 '/' 가 있으면 그 디렉터리 아래 전부.
# 이 파일이 없으면 가드는 $CANON_INVENTORY 에서 자동 파생한다(글롭·디렉터리는 디렉터리로 넓혀서).
# canon-init.sh 가 파생본을 만들어 준다: canon-init.sh --protected
#
# ★층 ②의 인벤토리보다 **의도적으로 넓게** 잡아라.
#   ②는 탐지라 정밀해야 소음이 안 나고, ③은 예방이라 넓어야 샌 곳이 안 생긴다.
#   과차단이 걱정되면 canon-guard.sh --self-test 의 A군(통과 14케이스)이 지켜 준다.

~/agents/CLAUDE.md
~/agents/orchestrator/
~/agents/shared/directives/
~/agents/memory/
~/agents/sub-org/
~/.claude/CLAUDE.md
~/.claude/settings.json

# 자기보호 — 감시 기구 자신(가드가 실행 시 CANON_HOME·CANON_BIN 을 자동으로 덧붙이지만
# 명시해 두는 편이 읽는 사람에게 분명하다)
~/.canon/
~/mindvirus-defense/scripts/
