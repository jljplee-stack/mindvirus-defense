# canon inventory v1 — 정본(자동 로드) 파일 무결성 워치 대상 목록  [예시]
# mindvirus-defense kit · MIT
#
# ★이 파일은 예시다. 경로를 **당신 조직의 실제 정본 경로로 바꿔야** 동작한다.
#   바꾸지 않으면 canon-verify.sh --list 가 0건을 낸다 — 0건은 "깨끗하다"가 아니라
#   "아무것도 안 보고 있다"이다. 반드시 --list 로 전개 결과를 눈으로 확인하라.
#
# 형식(TAB 구분):  <tier><TAB><selector>
#   selector = 절대경로 · glob(*, ?, []) · 디렉터리(watch 계열)
#   ~ 는 홈으로 전개된다.
#
# tier 4종:
#   strict      = 어떤 바이트 변경이든 즉시 ALERT.        (지침·헌장·설정처럼 정당 변경이 드문 것)
#   append      = 순수 append(기존 바이트 보존)면 NOTICE, 기존 내용이 바뀌면 ALERT.
#                 근거: 색인·원장형 정본은 정당한 추가가 잦다. 그런데 마인드바이러스의 형태는
#                 "이미 있던 문장을 바꾸는 것"이다 — 그 축만 ALERT로 둔다.
#   watch       = 디렉터리 재귀(*.md). 새 파일=NOTICE / 기존 파일 수정·삭제=ALERT.
#   watch-soft  = 디렉터리 재귀(*.md). 새 파일·수정=NOTICE / 삭제=ALERT.   (소음이 과할 때)
#
# 제외 규칙(하드코딩) — ★"접미"가 아니라 **파일명 어디에든 포함되면 제외**된다:
#     .bak  .new  .user  .lock   (부분 문자열 일치) · 끝의 ~ · .DS_Store · 숨김 파일(.으로 시작)
#   ⚠따라서 `policy.lockdown.md`(.lock 포함)·`backup.new-rules.md`(.new 포함) 같은 **정상 정본이
#     경보 없이 감시에서 빠진다.** 정본 파일명에 이 네 조각이 들어가지 않게 하거나,
#     `canon-verify.sh --list` 로 실제 전개 결과를 확인해 빠진 것이 없는지 눈으로 대조하라.
#
# ⚠ "#" 로 시작하는 줄은 전부 비활성이다. 제안을 적어 두고 싶으면 "#PROPOSE " 접두를 쓴 뒤,
#    채택할 때 그 접두만 지워라(줄의 나머지가 그대로 활성 항목 형식이다).

# ── ① 최상위 운영 규약(에이전트가 매 세션 읽는 규칙 파일) ──────────────
strict	~/agents/CLAUDE.md
strict	~/.claude/CLAUDE.md

# ── ② 정체성 헌장 ──────────────────────────────────────────────────
strict	~/agents/orchestrator/soul.md

# ── ③ 절대지침(역할별 지침 문서) ───────────────────────────────────
strict	~/agents/orchestrator/directives/*.md
strict	~/agents/shared/directives/*_DIRECTIVE.md

# ── ④ 장기기억(자동 주입 색인 + 본문) ──────────────────────────────
append	~/agents/memory/MEMORY.md
watch	~/agents/memory
#   ★소음 실측을 반드시 하라. 참조 사례(운영 조직 1곳, 138개 파일 14일 관측):
#     기억 본문이 하루 약 2.7건 정상 변경 → watch 유지 시 오케스트레이터가 하루 2~3건을
#     재서명으로 닫아야 한다. 감당 가능하면 watch 유지를 권한다
#     (기억 본문의 '기존 문장 교체'가 바로 마인드바이러스의 형태이기 때문).
#     과하면 위 한 줄의 tier 만 watch-soft 로 바꾼다. 무시하기 시작하는 것보다 낫다.

# ── ⑤ 하위 조직·부서 정본이 따로 있다면 함께 ───────────────────────
strict	~/agents/sub-org/CLAUDE.md
strict	~/agents/sub-org/soul.md
strict	~/agents/sub-org/directives/*.md

# ── ⑥ 훅·설정 파일 ─────────────────────────────────────────────────
#    문서는 아니지만 **층 ③ 가드를 무력화하는 단 한 줄이 여기 있다.**
#    정상 갱신이 잦은 조직이라면 소음이 될 수 있으니 관측 후 결정하라.
strict	~/.claude/settings.json

# ── ⑦ 워치 기구 자기보호(self-protection) ──────────────────────────
#    ★감시자를 무력화하면 감시가 끝난다. 이 6줄을 빼지 마라.
#    (킷을 다른 경로에 뒀다면 그 경로로 고친다)
strict	~/mindvirus-defense/scripts/canon-verify.sh
strict	~/mindvirus-defense/scripts/canon-resign.sh
strict	~/mindvirus-defense/scripts/canon-edit.sh
strict	~/mindvirus-defense/scripts/canon-sentinel.sh
strict	~/mindvirus-defense/scripts/canon-guard.sh
strict	~/.canon/inventory.conf
strict	~/.canon/protected.conf
#   ⚠`baseline.tsv` 와 `resign-ledger.jsonl` 은 **여기에 넣을 수 없다** — 층 ②가 스스로 바꾸는
#     파일이라 자기 감시가 성립하지 않는다(서명하는 행위가 다시 그 파일을 바꾼다).
#     그 둘의 보호는 층 ③(가드가 CANON_HOME 전체를 자동 보호) + 외부 복제에 맡긴다.
#     자세한 것은 docs/LIMITS.md §6.

# ⛔ 영구 제외 권고 — 세션 상태 파일(당일 다회 갱신·수백 KB)은 넣지 마라.
#    예: SESSION_STATE.md · TODO.md · 진행 로그. 이것들은 정본이 아니라 작업 상태이고,
#    넣는 순간 경보가 하루 수십 건이 되어 사람이 경보 전체를 무시하기 시작한다.
#    경보 피로는 감시 체계를 죽이는 가장 흔한 사인이다.
